[package]
name = "locr-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Stable C ABI for locr - universal local OCR. Consume from C, C++, C#, Java, Go, Swift, or anything with an FFI."
repository.workspace = true

[lib]
name = "locr"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
locr-core = { path = "../locr-core", version = "0.1.0", default-features = false, features = ["ocrs", "json"] }

[dev-dependencies]
serde_json = "1.0"

[features]
default = ["bundle-models"]
# Embed the OCR models in the library (recommended). Without it, the models
# are loaded from the directory named by the LOCR_MODELS_DIR environment variable.
bundle-models = ["locr-core/bundle-models"]

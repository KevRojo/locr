name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
      # The packaged crates are verified without assets/; point them at the models.
      LOCR_BUILD_MODELS_DIR: ${{ github.workspace }}/crates/locr-core/assets
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/ocr-models
      - run: cargo publish -p locr-core
      - run: cargo publish -p locr-ffi
      - run: cargo publish -p locr-cli
      - run: cargo publish -p locr-wasm

  binaries:
    name: Binaries (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: ./.github/actions/ocr-models
      # Separate target dirs: the `locr` CLI and the `locr` library would
      # otherwise collide on Windows (locr.pdb).
      - run: cargo build -p locr-ffi --release --target ${{ matrix.target }}
      - run: cargo build -p locr-cli --release --target ${{ matrix.target }} --target-dir target-cli
      - name: Package
        shell: bash
        run: |
          name="locr-${GITHUB_REF_NAME}-${{ matrix.target }}"
          lib="target/${{ matrix.target }}/release"
          bin="target-cli/${{ matrix.target }}/release"
          mkdir -p "$name/include" "$name/lib" "$name/bin"
          cp crates/locr-ffi/include/locr.h "$name/include/"
          cp LICENSE README.md crates/locr-core/NOTICE-MODELS "$name/"
          case "$RUNNER_OS" in
            Windows)
              cp "$lib/locr.dll" "$lib/locr.dll.lib" "$lib/locr.lib" "$name/lib/"
              cp "$bin/locr.exe" "$name/bin/"
              7z a "$name.zip" "$name"
              ;;
            macOS)
              cp "$lib/liblocr.dylib" "$lib/liblocr.a" "$name/lib/"
              cp "$bin/locr" "$name/bin/"
              tar czf "$name.tar.gz" "$name"
              ;;
            *)
              cp "$lib/liblocr.so" "$lib/liblocr.a" "$name/lib/"
              cp "$bin/locr" "$name/bin/"
              tar czf "$name.tar.gz" "$name"
              ;;
          esac
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            locr-*.tar.gz
            locr-*.zip

  pypi:
    name: Wheels (${{ matrix.os }} ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-latest, target: aarch64 }
          - { os: macos-latest, target: aarch64 }
          - { os: macos-latest, target: x86_64 }
          - { os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/ocr-models
      # abi3: one wheel per platform covers every CPython >= 3.9.
      - uses: PyO3/maturin-action@v1
        with:
          command: publish
          target: ${{ matrix.target }}
          # Linux: build in the manylinux container (portable wheels, aarch64
          # cross toolchain). Ignored on macOS and Windows.
          manylinux: auto
          args: --non-interactive --skip-existing
          working-directory: packages/locr-py
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}

  npm:
    name: Publish npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/ocr-models
      - id: bindgen
        run: echo "version=$(sed -n 's/^wasm-bindgen = "=\(.*\)"$/\1/p' crates/locr-wasm/Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.bindgen.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      # Lockfiles are not committed, hence `npm install` rather than `npm ci`.
      - working-directory: packages/locr-js
        run: npm install && npm run build && npm test
      - working-directory: packages/locr-js
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fails fast, with the downloaded digest in an annotation, when the models
  # do not match crates/locr-core/models.sha256; the other jobs then skip.
  models:
    name: OCR models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ocr-models

  rust:
    name: Rust (${{ matrix.os }})
    needs: models
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/ocr-models
      - if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - if: runner.os == 'Linux'
        name: Feature combinations
        run: |
          cargo check -p locr-core --no-default-features
          cargo check -p locr-core --no-default-features --features tesseract-cli
          cargo check -p locr-core --no-default-features --features ocrs,json,serde
      # Real models (smoke tests read hello.png), built like the shipped
      # artifacts: see [profile.ci]. Failures become annotations.
      - name: Test with the real models
        shell: bash
        run: bash .github/scripts/cargo-test.sh --workspace --profile ci
      # No bundled models: runtime loading (LOCR_MODELS_DIR, --models) with
      # the synthetic test models, in a debug build.
      - name: Test offline with the synthetic models
        shell: bash
        run: bash .github/scripts/cargo-test.sh -p locr-core -p locr-ffi -p locr-cli --no-default-features

  ffi:
    name: C ABI (${{ matrix.os }})
    needs: models
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/ocr-models
      - run: cargo build -p locr-ffi --release
      - name: Compile and run the C example against locr.h
        if: runner.os != 'Windows'
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic -I crates/locr-ffi/include \
            crates/locr-ffi/examples/c/locr_cli.c -L target/release -llocr \
            -Wl,-rpath,"$PWD/target/release" -o locr_cli
          set -o pipefail
          ./locr_cli crates/locr-core/tests/fixtures/hello.png | tee ocr-output.txt
          # What the real models read, visible on the run even when it passes.
          echo "::notice title=OCR of hello.png::$(sed -n 's/^text: //p' ocr-output.txt | head -c 300 | sed 's/%/%25/g')"
      - uses: actions/upload-artifact@v4
        with:
          name: locr-ffi-${{ matrix.os }}
          path: |
            target/release/*locr*.dll
            target/release/*locr*.so
            target/release/*locr*.dylib
            target/release/*locr*.a
            target/release/*locr*.lib
            crates/locr-ffi/include/locr.h

  npm:
    name: npm (WASM)
    needs: models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/ocr-models
      - id: bindgen
        name: wasm-bindgen version pinned by locr-wasm
        run: echo "version=$(sed -n 's/^wasm-bindgen = "=\(.*\)"$/\1/p' crates/locr-wasm/Cargo.toml)" >> "$GITHUB_OUTPUT"
      # cargo-binstall fetches the prebuilt wasm-bindgen release, or builds it.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall
      - run: cargo binstall --no-confirm --locked "wasm-bindgen-cli@${{ steps.bindgen.outputs.version }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - working-directory: packages/locr-js
        run: npm install && npm run build && npm test
      - working-directory: packages/locr-js
        run: npm pack --dry-run

  python:
    name: Python (${{ matrix.os }})
    needs: models
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/locr-py
      - uses: ./.github/actions/ocr-models
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build, install and test the wheel
        shell: bash
        working-directory: packages/locr-py
        run: |
          python -m pip install maturin pytest pillow numpy
          maturin build --release --out dist
          python -m pip install dist/*.whl
          python -m pytest tests

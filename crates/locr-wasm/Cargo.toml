[package]
name = "locr-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WASM build of locr-core"
repository.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
# Exact pin: the wasm-bindgen CLI used to generate the JS glue must match it.
wasm-bindgen = "=0.2.129"
console_error_panic_hook = "0.1"
locr-core = { path = "../locr-core", version = "0.1.0", default-features = false, features = ["ocrs", "json"] }

[features]
default = ["bundle-models"]
# Embed the OCR models in the .wasm (~12 MB). Without it, call `loadModels`.
bundle-models = ["locr-core/bundle-models"]

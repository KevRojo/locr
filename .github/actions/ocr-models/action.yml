name: OCR models
description: >
  Restore or download the ocrs models into crates/locr-core/assets, where
  build.rs picks them up instead of downloading them for every build, and
  check them against crates/locr-core/models.sha256 (build.rs checks again).
runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      id: cache
      with:
        path: crates/locr-core/assets
        key: ocrs-models-${{ runner.os }}-${{ hashFiles('crates/locr-core/models.sha256') }}
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p crates/locr-core/assets
        for model in text-detection.onnx text-recognition.onnx; do
          curl --fail --silent --show-error --location --retry 3 \
            --output "crates/locr-core/assets/$model" \
            "https://ocrs-models.s3-accelerate.amazonaws.com/$model"
        done
    - name: Check model digests
      shell: bash
      run: |
        sha256() {
          if command -v sha256sum >/dev/null; then sha256sum "$1"; else shasum -a 256 "$1"; fi | cut -d' ' -f1
        }
        status=0
        for model in text-detection.onnx text-recognition.onnx; do
          got=$(sha256 "crates/locr-core/assets/$model")
          # Strip CR: Windows runners check text files out with CRLF.
          want=$(awk -v file="$model" '{ sub(/\r$/, "") } $2 == file { print $1 }' crates/locr-core/models.sha256)
          if [ "$got" != "$want" ]; then
            # The digest goes into an annotation so it can be reviewed and pinned.
            echo "::error title=$model digest::pinned ${want:-nothing} in crates/locr-core/models.sha256, downloaded $got"
            status=1
          fi
        done
        exit $status

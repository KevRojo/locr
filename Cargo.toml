[workspace]
members = ["crates/locr-core", "crates/locr-wasm", "crates/locr-ffi", "crates/locr-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/KevRojo/locr"
authors = ["KevRojo <kevrojo@example.com>"]

# Shipped artifacts (C library, CLI, WASM): ~30% smaller .wasm and faster
# code, at the cost of longer release builds.
[profile.release]
lto = true
codegen-units = 1
strip = true

# CI tests with the real models: optimized like the shipped artifacts (ocrs and
# rten are very slow unoptimized). locr's own crates keep debug assertions and
# overflow checks; dependencies build exactly as in release.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
strip = false
debug-assertions = true
overflow-checks = true

[profile.ci.package."*"]
debug-assertions = false
overflow-checks = false
